name: streamkeeper

services:
  recorder:
    image: "${STREAM_KEEPER_IMAGE:-ghcr.io/nianzhibai/streamkeeper:latest}"
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      # Host interface the port is published on. 0.0.0.0 exposes the service on
      # every interface; set STREAM_KEEPER_BIND_ADDRESS=127.0.0.1 to keep it local-only.
      - "${STREAM_KEEPER_BIND_ADDRESS:-0.0.0.0}:${STREAM_KEEPER_WEB_PORT:-8000}:8000"
    environment:
      # Inside the container the app must listen on all interfaces for the
      # published port to reach it; host-side exposure is decided above.
      STREAM_KEEPER_WEB_HOST: 0.0.0.0
      STREAM_KEEPER_WEB_PORT: 8000
      STREAM_KEEPER_SESSION_TTL_HOURS: "${STREAM_KEEPER_SESSION_TTL_HOURS:-168}"
      STREAM_KEEPER_LOGIN_MAX_ATTEMPTS: "${STREAM_KEEPER_LOGIN_MAX_ATTEMPTS:-3}"
      STREAM_KEEPER_LOGIN_WINDOW_SECONDS: "${STREAM_KEEPER_LOGIN_WINDOW_SECONDS:-3600}"
      STREAM_KEEPER_MAX_CONCURRENT_RECORDINGS: "${STREAM_KEEPER_MAX_CONCURRENT_RECORDINGS:-3}"
      STREAM_KEEPER_FETCH_TIMEOUT_SECONDS: "${STREAM_KEEPER_FETCH_TIMEOUT_SECONDS:-45}"
      STREAM_KEEPER_QUARK_COOKIE: "${STREAM_KEEPER_QUARK_COOKIE:-}"
      STREAM_KEEPER_QUARK_ROOT_ID: "${STREAM_KEEPER_QUARK_ROOT_ID:-0}"
      STREAM_KEEPER_WOPAN_ACCESS_TOKEN: "${STREAM_KEEPER_WOPAN_ACCESS_TOKEN:-}"
      STREAM_KEEPER_WOPAN_REFRESH_TOKEN: "${STREAM_KEEPER_WOPAN_REFRESH_TOKEN:-}"
      STREAM_KEEPER_WOPAN_ROOT_ID: "${STREAM_KEEPER_WOPAN_ROOT_ID:-0}"
      STREAM_KEEPER_WOPAN_FAMILY_ID: "${STREAM_KEEPER_WOPAN_FAMILY_ID:-}"
      STREAM_KEEPER_BAIDU_ACCESS_TOKEN: "${STREAM_KEEPER_BAIDU_ACCESS_TOKEN:-}"
      STREAM_KEEPER_BAIDU_REFRESH_TOKEN: "${STREAM_KEEPER_BAIDU_REFRESH_TOKEN:-}"
      STREAM_KEEPER_BAIDU_CLIENT_ID: "${STREAM_KEEPER_BAIDU_CLIENT_ID:-}"
      STREAM_KEEPER_BAIDU_CLIENT_SECRET: "${STREAM_KEEPER_BAIDU_CLIENT_SECRET:-}"
      STREAM_KEEPER_115_COOKIE: "${STREAM_KEEPER_115_COOKIE:-}"
      STREAM_KEEPER_115_ACCESS_TOKEN: "${STREAM_KEEPER_115_ACCESS_TOKEN:-}"
      STREAM_KEEPER_115_REFRESH_TOKEN: "${STREAM_KEEPER_115_REFRESH_TOKEN:-}"
      STREAM_KEEPER_115_ROOT_ID: "${STREAM_KEEPER_115_ROOT_ID:-0}"
      STREAM_KEEPER_GUANGYA_ACCESS_TOKEN: "${STREAM_KEEPER_GUANGYA_ACCESS_TOKEN:-}"
      STREAM_KEEPER_GUANGYA_REFRESH_TOKEN: "${STREAM_KEEPER_GUANGYA_REFRESH_TOKEN:-}"
      STREAM_KEEPER_GUANGYA_CLIENT_ID: "${STREAM_KEEPER_GUANGYA_CLIENT_ID:-}"
      STREAM_KEEPER_GUANGYA_DEVICE_ID: "${STREAM_KEEPER_GUANGYA_DEVICE_ID:-}"
      STREAM_KEEPER_GUANGYA_ROOT_ID: "${STREAM_KEEPER_GUANGYA_ROOT_ID:-}"
      STREAM_KEEPER_UPLOAD_MODE: "${STREAM_KEEPER_UPLOAD_MODE:-scheduled}"
      STREAM_KEEPER_UPLOAD_HOUR: "${STREAM_KEEPER_UPLOAD_HOUR:-1}"
      STREAM_KEEPER_UPLOAD_MIN_AGE_MINUTES: "${STREAM_KEEPER_UPLOAD_MIN_AGE_MINUTES:-5}"
      STREAM_KEEPER_UPLOAD_TIMEOUT_SECONDS: "${STREAM_KEEPER_UPLOAD_TIMEOUT_SECONDS:-300}"
      STREAM_KEEPER_PROXY: "${STREAM_KEEPER_PROXY:-}"
      STREAM_KEEPER_DOUYIN_COOKIE: "${STREAM_KEEPER_DOUYIN_COOKIE:-}"
      STREAM_KEEPER_DOUYIN_COOKIE_FILE: "${STREAM_KEEPER_DOUYIN_COOKIE_FILE:-}"
      STREAM_KEEPER_BILIBILI_COOKIE: "${STREAM_KEEPER_BILIBILI_COOKIE:-}"
      STREAM_KEEPER_KUAISHOU_COOKIE: "${STREAM_KEEPER_KUAISHOU_COOKIE:-}"
      TZ: "${TZ:-Asia/Shanghai}"
      STREAM_KEEPER_WEB_WORKERS: 1
    volumes:
      - recorder-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  recorder-data:
