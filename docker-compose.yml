services:
  recorder:
    build: .
    image: douyin-stream-keeper:local
    restart: unless-stopped
    init: true
    ports:
      # Host interface the port is published on. 0.0.0.0 exposes the service on
      # every interface; set DOUYIN_BIND_ADDRESS=127.0.0.1 to keep it local-only.
      - "${DOUYIN_BIND_ADDRESS:-0.0.0.0}:${DOUYIN_WEB_PORT:-8000}:8000"
    environment:
      # Inside the container the app must listen on all interfaces for the
      # published port to reach it; host-side exposure is decided above.
      DOUYIN_WEB_HOST: 0.0.0.0
      DOUYIN_WEB_PORT: 8000
      DOUYIN_WEB_USERNAME: "${DOUYIN_WEB_USERNAME:-admin}"
      DOUYIN_WEB_PASSWORD: "${DOUYIN_WEB_PASSWORD:?请在 .env 中设置 DOUYIN_WEB_PASSWORD}"
      DOUYIN_SESSION_TTL_HOURS: "${DOUYIN_SESSION_TTL_HOURS:-168}"
      DOUYIN_LOGIN_MAX_ATTEMPTS: "${DOUYIN_LOGIN_MAX_ATTEMPTS:-3}"
      DOUYIN_LOGIN_WINDOW_SECONDS: "${DOUYIN_LOGIN_WINDOW_SECONDS:-3600}"
      DOUYIN_MAX_CONCURRENT_RECORDINGS: "${DOUYIN_MAX_CONCURRENT_RECORDINGS:-3}"
      DOUYIN_FETCH_TIMEOUT_SECONDS: "${DOUYIN_FETCH_TIMEOUT_SECONDS:-45}"
      DOUYIN_QUARK_COOKIE: "${DOUYIN_QUARK_COOKIE:-}"
      DOUYIN_QUARK_ROOT_ID: "${DOUYIN_QUARK_ROOT_ID:-0}"
      DOUYIN_WOPAN_ACCESS_TOKEN: "${DOUYIN_WOPAN_ACCESS_TOKEN:-}"
      DOUYIN_WOPAN_REFRESH_TOKEN: "${DOUYIN_WOPAN_REFRESH_TOKEN:-}"
      DOUYIN_WOPAN_ROOT_ID: "${DOUYIN_WOPAN_ROOT_ID:-0}"
      DOUYIN_WOPAN_FAMILY_ID: "${DOUYIN_WOPAN_FAMILY_ID:-}"
      DOUYIN_UPLOAD_HOUR: "${DOUYIN_UPLOAD_HOUR:-1}"
      DOUYIN_UPLOAD_MIN_AGE_MINUTES: "${DOUYIN_UPLOAD_MIN_AGE_MINUTES:-10}"
      DOUYIN_UPLOAD_TIMEOUT_SECONDS: "${DOUYIN_UPLOAD_TIMEOUT_SECONDS:-300}"
      DOUYIN_PROXY: "${DOUYIN_PROXY:-}"
      DOUYIN_COOKIE: "${DOUYIN_COOKIE:-}"
      DOUYIN_COOKIE_FILE: "${DOUYIN_COOKIE_FILE:-}"
      TZ: "${TZ:-Asia/Shanghai}"
      WEB_CONCURRENCY: 1
    volumes:
      - recorder-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  recorder-data:
