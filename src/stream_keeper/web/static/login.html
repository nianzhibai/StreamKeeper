<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <title>登录 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260814"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260814" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260842" />
  </head>
  <body class="login-page">
    <script src="/static/sprite.js?v=20260836"></script>
    <script src="/static/shell.js?v=20260821"></script>
    <div class="login-backdrop" aria-hidden="true"></div>

    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <a class="brand" href="/login">
          <span class="brand-mark" aria-hidden="true"><i></i></span>
          <span class="brand-text"><strong>Stream Keeper</strong><small>多平台直播录制</small></span>
        </a>

        <div class="login-heading">
          <h1 id="login-title">登录</h1>
          <p id="login-description">管理录制任务、本地录像与网盘归档</p>
        </div>

        <form id="login-form" class="login-form">
          <label class="field">
            <span class="field-label">用户名</span>
            <input id="login-username" class="input" name="username" type="text" required maxlength="128" autocomplete="username" autofocus />
          </label>
          <label class="field">
            <span class="field-label">密码</span>
            <input id="login-password" class="input" name="password" type="password" required maxlength="1024" autocomplete="current-password" />
          </label>
          <label id="setup-confirm-field" class="field hidden">
            <span class="field-label">确认密码</span>
            <input id="setup-password-confirmation" class="input" name="password_confirmation" type="password" minlength="10" maxlength="1024" autocomplete="new-password" disabled />
          </label>
          <p id="login-error" class="alert alert-bad hidden" role="alert" aria-live="polite"></p>
          <button id="login-submit" class="btn btn-primary btn-block" type="submit" disabled>登录</button>
        </form>
      </section>

      <footer class="login-foot">
        <span id="login-security-note">
          <svg class="ic ic-xs" aria-hidden="true"><use href="#ic-shield" /></svg>
          <span id="login-security-text">连续登录失败会锁定来源 IP</span>
        </span>
        <div id="login-theme"></div>
      </footer>
    </main>

    <script type="module" src="/static/login.js?v=20260824"></script>
  </body>
</html>
