<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="管理抖音、哔哩哔哩和快手直播录制任务：自动值守、开播即录、分段保存" />
    <title>录制任务 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260814"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260814" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260842" />
  </head>
  <body data-page="tasks">
    <script src="/static/sprite.js?v=20260836"></script>
    <script src="/static/shell.js?v=20260821"></script>
    <div class="app" id="app">
      <main class="main" id="main">
        <header class="page-head">
          <div class="page-heading">
            <h1>录制任务</h1>
          </div>
          <div class="page-tools">
            <button class="btn btn-primary" type="button" data-open-create>
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-plus" /></svg>新建任务
            </button>
          </div>
        </header>

        <div id="page-error" class="alert alert-bad hidden" role="alert">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <span data-error-text></span>
        </div>

        <section class="toolbar" aria-label="任务筛选">
          <div class="seg" role="group" aria-label="按状态筛选">
            <button class="seg-item is-active" type="button" data-filter="all">全部<span>0</span></button>
            <button class="seg-item" type="button" data-filter="recording">录制中<span>0</span></button>
            <button class="seg-item" type="button" data-filter="enabled">值守中<span>0</span></button>
            <button class="seg-item" type="button" data-filter="error">异常<span>0</span></button>
          </div>
          <label class="search">
            <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-search" /></svg>
            <input id="task-search" type="search" autocomplete="off" placeholder="搜索任务名或主播" aria-label="搜索任务" />
            <span class="kbd" aria-hidden="true">/</span>
          </label>
        </section>

        <div class="table-head task-head" aria-hidden="true">
          <span>任务</span><span>状态</span><span>录制配置</span><span>最近检查</span><span></span>
        </div>

        <section id="task-list" class="task-list" aria-live="polite">
          <div class="skeleton skeleton-task"></div>
          <div class="skeleton skeleton-task"></div>
          <div class="skeleton skeleton-task"></div>
        </section>

        <section id="task-empty" class="card empty hidden">
          <span class="empty-glyph"><svg class="ic" aria-hidden="true"><use href="#ic-record" /></svg></span>
          <strong id="task-empty-title">还没有录制任务</strong>
          <small id="task-empty-detail" class="hidden"></small>
        </section>
      </main>
    </div>

    <dialog id="task-dialog" class="modal" aria-labelledby="dialog-title">
      <form id="task-form" method="dialog">
        <header class="modal-head">
          <span class="modal-glyph tone-live" aria-hidden="true">
            <svg class="ic ic-sm"><use href="#ic-record" /></svg>
          </span>
          <div class="modal-heading">
            <h2 id="dialog-title">新建任务</h2>
            <p>支持抖音、哔哩哔哩和快手直播间</p>
          </div>
          <button class="btn btn-icon btn-ghost" type="button" data-close-dialog aria-label="关闭">
            <svg class="ic" aria-hidden="true"><use href="#ic-close" /></svg>
          </button>
        </header>

        <div class="modal-body">
          <label class="field span-2">
            <span class="field-label">直播间地址<b aria-hidden="true">*</b></span>
            <span class="input-row">
              <input id="task-url" class="input" name="url" type="text" required maxlength="1000" inputmode="url"
                placeholder="粘贴直播间链接或平台分享文案" autocomplete="off" />
              <button id="inspect-button" class="btn btn-soft" type="button">检测</button>
            </span>
          </label>
          <div id="inspect-result" class="inspect hidden" role="status"></div>

          <div class="form-grid">
            <label class="field span-2">
              <span class="field-label">任务名称<em>选填</em></span>
              <input class="input" name="label" type="text" maxlength="80" placeholder="留空时使用主播昵称" />
            </label>
            <label class="field">
              <span class="field-label">画质</span>
              <select class="input" name="quality">
                <option value="OD">原画</option>
                <option value="UHD">超清</option>
                <option value="HD">高清</option>
                <option value="SD">标清</option>
                <option value="LD">流畅</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">保存格式</span>
              <select class="input" name="output_format">
                <option value="ts">TS</option>
                <option value="mp4">MP4</option>
                <option value="mkv">MKV</option>
                <option value="flv">FLV</option>
              </select>
            </label>
          </div>

          <div class="option-row">
            <label id="monitor-field" class="option">
              <input name="monitor" type="checkbox" aria-describedby="monitor-hint" checked />
              <span class="switch" aria-hidden="true"></span>
              <span class="option-text"><strong>持续值守</strong><small id="monitor-hint">下播后继续等待下一场</small></span>
            </label>
            <label id="auto-start-field" class="option">
              <input name="auto_start" type="checkbox" checked />
              <span class="switch" aria-hidden="true"></span>
              <span class="option-text"><strong>立即启动</strong><small>创建后马上开始检查</small></span>
            </label>
          </div>

          <details class="disclosure">
            <summary>
              <span>高级设置</span>
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronDown" /></svg>
            </summary>
            <div class="form-grid">
              <label class="field">
                <span class="field-label">直播源</span>
                <select class="input" name="source">
                  <option value="auto">自动选择</option>
                  <option value="flv">优先 FLV</option>
                  <option value="hls">使用 HLS</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label">检查间隔</span>
                <span class="suffix"><input class="input" name="interval_seconds" type="number" min="10" max="86400" step="1" value="60" /><em>秒</em></span>
              </label>
              <label class="field">
                <span class="field-label">分段时长</span>
                <span class="suffix"><input class="input" name="segment_seconds" type="number" min="0" max="86400" step="1" value="1800" /><em>秒</em></span>
              </label>
              <label class="field">
                <span class="field-label">录制段数</span>
                <span class="suffix"><input class="input" name="segment_count" type="number" min="0" max="10000" step="1" value="0" /><em>段</em></span>
              </label>
              <p class="field-hint span-2">默认使用“设置”中的录制参数，在此修改时仅覆盖当前任务。分段时长设为 0 表示不切分；录制段数设为 0 表示不限制，设置录制段数后任务会作为单次录制执行。</p>
            </div>
          </details>
        </div>

        <footer class="modal-foot">
          <button class="btn btn-soft" type="button" data-close-dialog>取消</button>
          <button id="task-submit" class="btn btn-primary" type="submit">创建任务</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/static/tasks.js?v=20260835"></script>
  </body>
</html>
