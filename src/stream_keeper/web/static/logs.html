<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="查看开播、录制、归档与登录等关键运行事件" />
    <title>运行日志 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260878"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260878" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260878" />
  </head>
  <body data-page="logs">
    <script src="/static/sprite.js?v=20260878"></script>
    <script src="/static/shell.js?v=20260878"></script>
    <div class="app" id="app">
      <main class="main" id="main">
        <header class="page-head">
          <div class="page-heading">
            <h1>运行日志</h1>
          </div>
          <div class="page-tools">
            <a id="log-export" class="btn btn-soft" href="/api/events/export?format=txt" download>
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-download" /></svg>导出
            </a>
            <button id="log-clear" class="btn btn-soft" type="button">
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-trash" /></svg>清空
            </button>
          </div>
        </header>

        <div id="page-error" class="alert alert-bad hidden" role="alert">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <span data-error-text></span>
        </div>

        <div id="log-attention" class="alert log-attention tone-bad hidden" role="status">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <strong id="log-attention-text">—</strong>
          <button id="log-attention-filter" class="btn btn-sm btn-soft" type="button" data-level="error">查看异常</button>
        </div>

        <section class="card" aria-label="运行事件">
          <div class="log-toolbar">
            <label class="search">
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-search" /></svg>
              <input id="log-search" type="search" autocomplete="off" placeholder="搜索事件或详情" aria-label="搜索日志" />
              <span class="kbd" aria-hidden="true">/</span>
            </label>
            <div id="log-level-chips" class="log-levels" role="group" aria-label="按级别筛选">
              <button class="chip-toggle tone-bad" type="button" data-level="error" aria-pressed="false">
                <span class="chip-dot" aria-hidden="true"></span>异常<em data-count>0</em>
              </button>
              <button class="chip-toggle tone-warn" type="button" data-level="warning" aria-pressed="false">
                <span class="chip-dot" aria-hidden="true"></span>警告<em data-count>0</em>
              </button>
              <button class="chip-toggle tone-ok" type="button" data-level="success" aria-pressed="false">
                <span class="chip-dot" aria-hidden="true"></span>完成<em data-count>0</em>
              </button>
              <button class="chip-toggle tone-info" type="button" data-level="info" aria-pressed="false">
                <span class="chip-dot" aria-hidden="true"></span>提示<em data-count>0</em>
              </button>
            </div>
            <label class="select-inline">
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-layers" /></svg>
              <select id="log-category" aria-label="按类别筛选">
                <option value="">全部类别</option>
                <option value="task">录制</option>
                <option value="upload">归档</option>
                <option value="system">系统</option>
                <option value="auth">账号</option>
              </select>
            </label>
            <label class="switch-field">
              <input id="log-auto" type="checkbox" checked />
              <span class="switch" aria-hidden="true"></span>
              <span>自动刷新</span>
            </label>
          </div>

          <div id="log-scope" class="log-scope hidden">
            <svg class="ic ic-xs" aria-hidden="true"><use href="#ic-record" /></svg>
            <span id="log-scope-label">单个任务</span>
            <button id="log-scope-clear" type="button" aria-label="取消任务筛选" title="取消任务筛选">
              <svg class="ic ic-xs" aria-hidden="true"><use href="#ic-close" /></svg>
            </button>
          </div>

          <ol id="log-list" class="log-feed" aria-live="polite" aria-label="运行事件列表">
            <li class="skeleton skeleton-row"></li>
            <li class="skeleton skeleton-row"></li>
            <li class="skeleton skeleton-row"></li>
          </ol>

          <div id="log-empty" class="empty empty-sm hidden">
            <span class="empty-glyph"><svg class="ic" aria-hidden="true"><use href="#ic-logs" /></svg></span>
            <strong>暂无运行事件</strong>
            <small>启动录制任务或执行网盘归档后，这里会记录关键节点</small>
            <button id="log-clear-filters" class="btn btn-sm btn-soft hidden" type="button">清除筛选</button>
          </div>

          <footer class="log-foot">
            <span id="log-summary">正在读取…</span>
            <button id="log-more" class="btn btn-sm btn-soft hidden" type="button">
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronDown" /></svg>加载更早
            </button>
          </footer>
        </section>
      </main>
    </div>

    <script type="module" src="/static/logs.js?v=20260878"></script>
  </body>
</html>
