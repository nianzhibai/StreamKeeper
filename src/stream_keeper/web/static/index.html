<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Stream Keeper 概览：录制状态、值守任务与系统运行情况" />
    <title>概览 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260814"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260814" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260820" />
  </head>
  <body data-page="dashboard">
    <script src="/static/sprite.js?v=20260814"></script>
    <script src="/static/shell.js?v=20260814"></script>
    <div class="app" id="app">
      <main class="main" id="main">
        <header class="page-head">
          <div class="page-heading">
            <p class="page-eyebrow">
              <svg class="ic" aria-hidden="true"><use href="#ic-pulse" /></svg>工作台
            </p>
            <h1>概览</h1>
            <p>录制状态与系统运行情况一览</p>
          </div>
          <div class="page-tools">
            <button id="refresh-button" class="btn btn-icon btn-soft" type="button" aria-label="刷新" title="刷新">
              <svg class="ic" aria-hidden="true"><use href="#ic-refresh" /></svg>
            </button>
            <a class="btn btn-primary" href="/tasks?create=1">
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-plus" /></svg>新建任务
            </a>
          </div>
        </header>

        <div id="page-error" class="alert alert-bad hidden" role="alert">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <span data-error-text></span>
        </div>

        <section class="stat-grid" aria-label="运行摘要">
          <article class="stat is-live">
            <header>
              <p class="stat-label">录制中</p>
              <span class="stat-icon"><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-record" /></svg></span>
            </header>
            <strong class="stat-value" id="stat-recording">—</strong>
            <p class="stat-note" id="stat-recording-note">读取中</p>
          </article>

          <article class="stat">
            <header>
              <p class="stat-label">值守中</p>
              <span class="stat-icon"><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-pulse" /></svg></span>
            </header>
            <strong class="stat-value" id="stat-waiting">—</strong>
            <p class="stat-note" id="stat-waiting-note">等待开播</p>
          </article>

          <article class="stat">
            <header>
              <p class="stat-label">全部任务</p>
              <span class="stat-icon"><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-layers" /></svg></span>
            </header>
            <strong class="stat-value" id="stat-total">—</strong>
            <p class="stat-note" id="stat-total-note">读取中</p>
          </article>

          <article class="stat">
            <header>
              <p class="stat-label">可用空间</p>
              <span class="stat-icon"><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-disk" /></svg></span>
            </header>
            <strong class="stat-value" id="stat-disk">—</strong>
            <p class="stat-note" id="stat-disk-note">录像存储盘</p>
          </article>
        </section>

        <div class="dash-grid">
          <section class="card card-runtime">
            <header class="card-head">
              <span class="card-glyph tone-live" aria-hidden="true">
                <svg class="ic ic-sm"><use href="#ic-record" /></svg>
              </span>
              <div class="card-heading">
                <h2>当前任务</h2>
                <p>正在录制或等待开播的直播间</p>
              </div>
              <a class="link" href="/tasks">全部任务<svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronRight" /></svg></a>
            </header>
            <div id="active-task-list" class="mini-list" aria-live="polite">
              <div class="skeleton skeleton-row"></div>
              <div class="skeleton skeleton-row"></div>
              <div class="skeleton skeleton-row"></div>
            </div>
            <div id="active-task-empty" class="empty empty-sm hidden">
              <span class="empty-glyph"><svg class="ic" aria-hidden="true"><use href="#ic-checkCircle" /></svg></span>
              <strong>当前没有运行中的任务</strong>
              <small>启用任务后，开播会自动开始录制</small>
              <a class="btn btn-soft btn-sm" href="/tasks">前往任务列表</a>
            </div>
          </section>

          <section class="card">
            <header class="card-head">
              <span class="card-glyph tone-info" aria-hidden="true">
                <svg class="ic ic-sm"><use href="#ic-cloud" /></svg>
              </span>
              <div class="card-heading">
                <h2>网盘归档</h2>
                <p id="overview-archive-time">读取中</p>
              </div>
              <a class="link" href="/archive">详情<svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronRight" /></svg></a>
            </header>
            <div class="card-body">
              <div class="archive-brief">
                <span id="overview-archive-status" class="pill tone-idle"><i class="dot"></i>读取中</span>
                <div class="kv">
                  <small>下次执行</small>
                  <strong id="overview-next-run">—</strong>
                </div>
              </div>
              <ul class="provider-mini">
                <li>
                  <span class="provider-logo quark" aria-hidden="true">夸</span>
                  <strong>夸克网盘</strong>
                  <span id="overview-quark-status" class="mini-state">—</span>
                </li>
                <li>
                  <span class="provider-logo wopan" aria-hidden="true">联</span>
                  <strong>联通云盘</strong>
                  <span id="overview-wopan-status" class="mini-state">—</span>
                </li>
                <li>
                  <span class="provider-logo baidu" aria-hidden="true">百</span>
                  <strong>百度网盘</strong>
                  <span id="overview-baidu-status" class="mini-state">—</span>
                </li>
                <li>
                  <span class="provider-logo pan115" aria-hidden="true">115</span>
                  <strong>115网盘</strong>
                  <span id="overview-pan115-status" class="mini-state">—</span>
                </li>
                <li>
                  <span class="provider-logo guangya" aria-hidden="true">光</span>
                  <strong>光鸭网盘</strong>
                  <span id="overview-guangya-status" class="mini-state">—</span>
                </li>
              </ul>
            </div>
          </section>

          <section class="card">
            <header class="card-head">
              <span class="card-glyph" aria-hidden="true">
                <svg class="ic ic-sm"><use href="#ic-server" /></svg>
              </span>
              <div class="card-heading">
                <h2>系统</h2>
                <p>录制环境自检</p>
              </div>
            </header>
            <dl class="spec-list">
              <div><dt>并发录制</dt><dd id="system-recording-limit">—</dd></div>
              <div><dt>FFmpeg</dt><dd id="system-ffmpeg">—</dd></div>
              <div><dt>Node.js</dt><dd id="system-node">—</dd></div>
              <div><dt>录像目录</dt><dd id="system-directory" class="mono">—</dd></div>
            </dl>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="/static/dashboard.js?v=20260820"></script>
  </body>
</html>
