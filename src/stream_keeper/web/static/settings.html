<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="配置网盘归档的执行计划" />
    <title>设置 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260816"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260814" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260816" />
  </head>
  <body data-page="settings">
    <script src="/static/sprite.js?v=20260814"></script>
    <script src="/static/shell.js?v=20260814"></script>
    <div class="app" id="app">
      <main class="main main-settings" id="main">
        <header class="page-head">
          <div class="page-heading">
            <p class="page-eyebrow">
              <svg class="ic" aria-hidden="true"><use href="#ic-settings" /></svg>运维
            </p>
            <h1>设置</h1>
            <p>配置网盘归档的执行计划</p>
          </div>
          <div class="page-tools">
            <a class="btn btn-soft" href="/archive">管理存储目标</a>
          </div>
        </header>

        <div id="page-error" class="alert alert-bad hidden" role="alert">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <span data-error-text></span>
        </div>

        <form id="archive-schedule-form" class="settings">
          <section class="card">
            <header class="card-head">
              <span class="card-glyph" aria-hidden="true">
                <svg class="ic ic-sm"><use href="#ic-clock" /></svg>
              </span>
              <div class="card-heading">
                <h2>归档执行计划</h2>
                <p>使用服务器本地时区；存储目标请在网盘归档页面配置</p>
              </div>
            </header>
            <div class="card-body">
              <div class="form-grid form-grid-3">
                <label class="field">
                  <span class="field-label">每日开始时间</span>
                  <span class="suffix"><input class="input" name="upload_hour" type="number" min="0" max="23" step="1" value="1" /><em>时</em></span>
                </label>
                <label class="field">
                  <span class="field-label">文件稳定时间</span>
                  <span class="suffix"><input class="input" name="upload_min_age_minutes" type="number" min="0" max="1440" step="1" value="10" /><em>分钟</em></span>
                </label>
                <label class="field">
                  <span class="field-label">网络超时</span>
                  <span class="suffix"><input class="input" name="upload_timeout_seconds" type="number" min="30" max="86400" step="1" value="300" /><em>秒</em></span>
                </label>
                <p class="field-hint span-3">只有最后修改时间超过「文件稳定时间」的录像才会被上传，避免传走正在写入的片段。</p>
              </div>
            </div>
          </section>

          <div class="save-bar">
            <span class="save-hint" data-save-hint>所有更改已保存</span>
            <div class="save-actions">
              <button class="btn btn-soft" type="button" data-reset-form>放弃更改</button>
              <button id="schedule-save-button" class="btn btn-primary" type="submit">保存计划</button>
            </div>
          </div>
        </form>
      </main>
    </div>

    <script type="module" src="/static/settings.js?v=20260816"></script>
  </body>
</html>
