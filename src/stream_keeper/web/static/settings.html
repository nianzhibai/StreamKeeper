<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="配置管理员账号、录制并发、任务默认值与网盘归档计划" />
    <title>配置面板 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260877"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260877" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260877" />
  </head>
  <body data-page="settings">
    <script src="/static/sprite.js?v=20260877"></script>
    <script src="/static/shell.js?v=20260877"></script>
    <div class="app" id="app">
      <main class="main main-settings" id="main">
        <header class="page-head">
          <div class="page-heading">
            <h1>配置面板</h1>
          </div>
        </header>

        <div id="page-error" class="alert alert-bad hidden" role="alert">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <span data-error-text></span>
        </div>

        <section id="account-settings-card" class="card">
          <header class="card-head">
            <span class="card-glyph" aria-hidden="true">
              <svg class="ic ic-sm"><use href="#ic-user" /></svg>
            </span>
            <div class="card-heading">
              <h2>管理员账号</h2>
            </div>
          </header>
          <form id="account-settings-form" class="card-body">
            <div class="form-grid">
              <label class="field">
                <span class="field-label">用户名</span>
                <input class="input" name="username" type="text" minlength="1" maxlength="128" autocomplete="username" required />
              </label>
              <label class="field">
                <span class="field-label">新密码<em>留空则不修改</em></span>
                <input class="input" name="new_password" type="password" minlength="10" maxlength="1024" autocomplete="new-password" />
              </label>
              <div class="account-actions span-2">
                <button id="account-save-button" class="btn btn-primary" type="submit" disabled>更新账号</button>
              </div>
            </div>
          </form>
        </section>

        <form id="archive-schedule-form" class="settings">
          <section class="card">
            <header class="card-head">
              <span class="card-glyph" aria-hidden="true">
                <svg class="ic ic-sm"><use href="#ic-layers" /></svg>
              </span>
              <div class="card-heading">
                <h2>录制并发</h2>
              </div>
            </header>
            <div class="card-body">
              <div class="form-grid">
                <label class="field">
                  <span class="field-label">同时录制上限</span>
                  <span class="suffix"><input class="input" name="max_concurrent_recordings" type="number" min="1" max="100" step="1" value="3" required /><em>路</em></span>
                </label>
              </div>
            </div>
          </section>

          <section class="card">
            <header class="card-head">
              <span class="card-glyph" aria-hidden="true">
                <svg class="ic ic-sm"><use href="#ic-record" /></svg>
              </span>
              <div class="card-heading">
                <h2>录制默认值</h2>
              </div>
            </header>
            <div class="card-body">
              <div class="form-grid">
                <label class="field">
                  <span class="field-label">保存格式</span>
                  <select class="input" name="recording_output_format">
                    <option value="ts">TS</option>
                    <option value="mp4">MP4</option>
                    <option value="mkv">MKV</option>
                    <option value="flv">FLV</option>
                  </select>
                </label>
                <label class="field">
                  <span class="field-label">分段时长</span>
                  <span class="suffix"><input class="input" name="recording_segment_minutes" type="number" min="0" max="1440" step="any" value="30" required /><em>分钟</em></span>
                </label>
                <label class="field">
                  <span class="field-label">录制段数</span>
                  <span class="suffix"><input class="input" name="recording_segment_count" type="number" min="0" max="10000" step="1" value="0" required /><em>段</em></span>
                </label>
              </div>
            </div>
          </section>

          <section class="card">
            <header class="card-head">
              <span class="card-glyph" aria-hidden="true">
                <svg class="ic ic-sm"><use href="#ic-clock" /></svg>
              </span>
              <div class="card-heading">
                <h2>上传模式</h2>
              </div>
            </header>
            <div class="card-body">
              <div class="form-grid">
                <label class="field">
                  <span class="field-label">上传模式</span>
                  <select class="input" name="upload_mode">
                    <option value="scheduled">定时上传</option>
                    <option value="recording_completed">及时上传</option>
                  </select>
                </label>
                <label class="field" data-scheduled-field>
                  <span class="field-label">每日开始时间</span>
                  <span class="suffix"><input class="input" name="upload_hour" type="number" min="0" max="23" step="1" value="1" /><em>时</em></span>
                </label>
                <label class="field">
                  <span class="field-label">文件稳定时间</span>
                  <span class="suffix"><input class="input" name="upload_min_age_minutes" type="number" min="0" max="1440" step="1" value="5" /><em>分钟</em></span>
                </label>
                <label class="field">
                  <span class="field-label">网络超时</span>
                  <span class="suffix"><input class="input" name="upload_timeout_seconds" type="number" min="30" max="86400" step="1" value="300" /><em>秒</em></span>
                </label>
              </div>
            </div>
          </section>

          <div class="save-bar">
            <span class="save-hint" data-save-hint>所有更改已保存</span>
            <div class="save-actions">
              <button class="btn btn-soft" type="button" data-reset-form disabled>放弃更改</button>
              <button id="schedule-save-button" class="btn btn-primary" type="submit" disabled>保存设置</button>
            </div>
          </div>
        </form>
      </main>
    </div>

    <script type="module" src="/static/settings.js?v=20260877"></script>
  </body>
</html>
