<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="把本地录像同步到多个网盘，并按需清理磁盘" />
    <title>网盘归档 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260816"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260814" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260829" />
  </head>
  <body data-page="archive">
    <script src="/static/sprite.js?v=20260821"></script>
    <script src="/static/shell.js?v=20260821"></script>
    <div class="app" id="app">
      <main class="main" id="main">
        <header class="page-head">
          <div class="page-heading">
            <h1>网盘归档</h1>
          </div>
          <div class="page-tools">
            <a class="btn btn-soft" href="/settings">归档计划</a>
            <button id="cloud-run-button" class="btn btn-primary" type="button" disabled>
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-upload" /></svg>立即归档
            </button>
          </div>
        </header>

        <div id="page-error" class="alert alert-bad hidden" role="alert">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <span data-error-text></span>
        </div>

        <section class="card hero" aria-label="归档状态">
          <div class="hero-state">
            <span id="archive-status" class="pill pill-lg tone-idle"><i class="dot"></i>读取中</span>
            <strong id="archive-status-time">—</strong>
          </div>
          <dl class="hero-facts">
            <div>
              <dt><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-calendar" /></svg>下次执行</dt>
              <dd id="next-run-time">—</dd>
            </div>
            <div>
              <dt><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-clock" /></svg>上传模式</dt>
              <dd id="upload-mode">—</dd>
            </div>
            <div>
              <dt><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-shield" /></svg>文件稳定时间</dt>
              <dd id="stable-age">—</dd>
            </div>
          </dl>
        </section>

        <div class="archive-grid">
          <section class="card">
            <header class="card-head">
              <span class="card-glyph tone-info" aria-hidden="true">
                <svg class="ic ic-sm"><use href="#ic-cloud" /></svg>
              </span>
              <div class="card-heading">
                <h2>存储目标</h2>
                <p>点击网盘配置凭据、上传根目录和启用状态</p>
              </div>
            </header>
            <div class="card-body">
              <button
                id="quark-configure"
                class="provider-row provider-target"
                type="button"
                data-provider-configure="quark"
                aria-haspopup="dialog"
                aria-label="配置夸克网盘"
              >
                <span class="provider-logo quark has-image" aria-hidden="true">
                  <img class="provider-logo-image" src="/static/provider-quark.png?v=20260823" alt="" />
                </span>
                <span class="provider-info">
                  <strong>夸克网盘</strong>
                  <small id="quark-path" class="mono">—</small>
                </span>
                <span id="quark-credential" class="chip">—</span>
                <span id="quark-status" class="pill tone-idle"><i class="dot"></i>读取中</span>
                <span class="provider-row-action" aria-hidden="true">
                  <span>配置</span><svg class="ic ic-sm"><use href="#ic-chevronRight" /></svg>
                </span>
              </button>
              <button
                id="wopan-configure"
                class="provider-row provider-target"
                type="button"
                data-provider-configure="wopan"
                aria-haspopup="dialog"
                aria-label="配置联通云盘"
              >
                <span class="provider-logo wopan has-image" aria-hidden="true">
                  <img class="provider-logo-image" src="/static/provider-wopan.png?v=20260823" alt="" />
                </span>
                <span class="provider-info">
                  <strong>联通云盘</strong>
                  <small id="wopan-path" class="mono">—</small>
                </span>
                <span id="wopan-credential" class="chip">—</span>
                <span id="wopan-status" class="pill tone-idle"><i class="dot"></i>读取中</span>
                <span class="provider-row-action" aria-hidden="true">
                  <span>配置</span><svg class="ic ic-sm"><use href="#ic-chevronRight" /></svg>
                </span>
              </button>
              <button
                id="baidu-configure"
                class="provider-row provider-target"
                type="button"
                data-provider-configure="baidu"
                aria-haspopup="dialog"
                aria-label="配置百度网盘"
              >
                <span class="provider-logo baidu has-image" aria-hidden="true">
                  <img class="provider-logo-image" src="/static/provider-baidu.png?v=20260824" alt="" />
                </span>
                <span class="provider-info">
                  <strong>百度网盘</strong>
                  <small id="baidu-path" class="mono">—</small>
                </span>
                <span id="baidu-credential" class="chip">—</span>
                <span id="baidu-status" class="pill tone-idle"><i class="dot"></i>读取中</span>
                <span class="provider-row-action" aria-hidden="true">
                  <span>配置</span><svg class="ic ic-sm"><use href="#ic-chevronRight" /></svg>
                </span>
              </button>
              <button
                id="pan115-configure"
                class="provider-row provider-target"
                type="button"
                data-provider-configure="pan115"
                aria-haspopup="dialog"
                aria-label="配置115网盘"
              >
                <span class="provider-logo pan115 has-image" aria-hidden="true">
                  <img class="provider-logo-image" src="/static/provider-pan115.png?v=20260823" alt="" />
                </span>
                <span class="provider-info">
                  <strong>115网盘</strong>
                  <small id="pan115-path" class="mono">—</small>
                </span>
                <span id="pan115-credential" class="chip">—</span>
                <span id="pan115-status" class="pill tone-idle"><i class="dot"></i>读取中</span>
                <span class="provider-row-action" aria-hidden="true">
                  <span>配置</span><svg class="ic ic-sm"><use href="#ic-chevronRight" /></svg>
                </span>
              </button>
              <button
                id="guangya-configure"
                class="provider-row provider-target"
                type="button"
                data-provider-configure="guangya"
                aria-haspopup="dialog"
                aria-label="配置光鸭网盘"
              >
                <span class="provider-logo guangya has-image" aria-hidden="true">
                  <img class="provider-logo-image" src="/static/provider-guangya.png?v=20260823" alt="" />
                </span>
                <span class="provider-info">
                  <strong>光鸭网盘</strong>
                  <small id="guangya-path" class="mono">—</small>
                </span>
                <span id="guangya-credential" class="chip">—</span>
                <span id="guangya-status" class="pill tone-idle"><i class="dot"></i>读取中</span>
                <span class="provider-row-action" aria-hidden="true">
                  <span>配置</span><svg class="ic ic-sm"><use href="#ic-chevronRight" /></svg>
                </span>
              </button>
            </div>
          </section>

          <section class="card">
            <header class="card-head">
              <span class="card-glyph" aria-hidden="true">
                <svg class="ic ic-sm"><use href="#ic-clock" /></svg>
              </span>
              <div class="card-heading">
                <h2>最近执行</h2>
                <p id="last-run-time">读取中</p>
              </div>
            </header>
            <div class="card-body">
              <div class="run-metrics">
                <div><small>扫描文件</small><strong id="run-scanned">—</strong></div>
                <div><small>上传副本</small><strong id="run-uploaded">—</strong></div>
                <div><small>跳过</small><strong id="run-skipped">—</strong></div>
                <div><small>清理本地</small><strong id="run-deleted">—</strong></div>
                <div class="is-danger"><small>失败</small><strong id="run-failed">—</strong></div>
              </div>
              <div id="run-targets" class="run-targets" aria-live="polite">
                <p class="run-targets-empty">尚无目标执行记录</p>
              </div>
              <p id="last-run-detail" class="run-detail">—</p>
            </div>
          </section>
        </div>
      </main>
    </div>

    <dialog id="provider-config-dialog" class="modal" aria-labelledby="provider-config-title">
      <form id="provider-config-form">
        <header class="modal-head">
          <span id="provider-config-logo" class="provider-logo" aria-hidden="true"></span>
          <div class="modal-heading">
            <h2 id="provider-config-title">配置网盘</h2>
            <p id="provider-config-description">配置存储目标</p>
          </div>
          <button id="provider-config-close" class="btn btn-icon btn-ghost" type="button" aria-label="关闭">
            <svg class="ic" aria-hidden="true"><use href="#ic-close" /></svg>
          </button>
        </header>
        <div class="modal-body">
          <div class="provider-config-state">
            <div>
              <strong>存储目标</strong>
              <small id="provider-credential-hint">读取中</small>
            </div>
            <label class="switch-field">
              <input name="enabled" type="checkbox" />
              <span class="switch" aria-hidden="true"></span>
              <span>启用</span>
            </label>
          </div>

          <div class="auth-row">
            <div>
              <strong id="provider-login-title">账号授权</strong>
              <small id="provider-login-description"></small>
            </div>
            <button id="provider-login-button" class="btn btn-soft" type="button" data-cloud-login>
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-key" /></svg>扫码登录
            </button>
          </div>

          <section data-provider-fields="quark" class="provider-config-fields">
            <div class="form-grid">
              <label class="field">
                <span class="field-label">Root ID</span>
                <input class="input" name="quark_root_id" type="text" maxlength="512" value="0" autocomplete="off" />
              </label>
              <label class="field">
                <span class="field-label">上传目录<em>只读</em></span>
                <input class="input" name="quark_upload_path" type="text" value="/DouYinStreamKeeper" readonly />
              </label>
            </div>
            <details class="disclosure">
              <summary>
                <span>手动凭证</span>
                <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronDown" /></svg>
              </summary>
              <div class="form-grid">
                <label class="field span-2">
                  <span class="field-label">Cookie</span>
                  <input class="input" name="quark_cookie" type="password" maxlength="32768" autocomplete="new-password" placeholder="留空则保持现有 Cookie" />
                </label>
                <label class="check span-2">
                  <input name="quark_clear_cookie" type="checkbox" />
                  <span>清除已保存的 Cookie</span>
                </label>
              </div>
            </details>
          </section>

          <section data-provider-fields="wopan" class="provider-config-fields hidden">
            <div class="form-grid">
              <label class="field">
                <span class="field-label">Root ID</span>
                <input class="input" name="wopan_root_id" type="text" maxlength="512" value="0" autocomplete="off" />
              </label>
              <label class="field">
                <span class="field-label">Family ID<em>选填</em></span>
                <input class="input" name="wopan_family_id" type="text" maxlength="512" placeholder="个人云可留空" autocomplete="off" />
              </label>
              <label class="field span-2">
                <span class="field-label">上传目录<em>只读</em></span>
                <input class="input" name="wopan_upload_path" type="text" value="/DouYinStreamKeeper" readonly />
              </label>
            </div>
            <details class="disclosure">
              <summary>
                <span>手动凭证</span>
                <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronDown" /></svg>
              </summary>
              <div class="form-grid">
                <label class="field">
                  <span class="field-label">Access Token</span>
                  <input class="input" name="wopan_access_token" type="password" maxlength="4096" autocomplete="new-password" placeholder="留空则保持不变" />
                </label>
                <label class="field">
                  <span class="field-label">Refresh Token</span>
                  <input class="input" name="wopan_refresh_token" type="password" maxlength="4096" autocomplete="new-password" placeholder="留空则保持不变" />
                </label>
                <label class="check span-2">
                  <input name="wopan_clear_tokens" type="checkbox" />
                  <span>清除已保存的 Token</span>
                </label>
              </div>
            </details>
          </section>

          <section data-provider-fields="baidu" class="provider-config-fields hidden">
            <div class="form-grid">
              <label class="field span-2">
                <span class="field-label">上传目录<em>固定</em></span>
                <input class="input" name="baidu_upload_path" type="text" value="/DouYinStreamKeeper" readonly />
              </label>
            </div>
            <details class="disclosure">
              <summary><span>百度登录凭据</span><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronDown" /></svg></summary>
              <div class="form-grid">
                <label class="field span-2"><span class="field-label">Cookie</span><input class="input" name="baidu_cookie" type="password" maxlength="32768" autocomplete="new-password" placeholder="扫码登录后自动保存" /></label>
                <label class="field"><span class="field-label">Access Token<em>可选</em></span><input class="input" name="baidu_access_token" type="password" maxlength="4096" autocomplete="new-password" placeholder="百度开放平台" /></label>
                <label class="field"><span class="field-label">Refresh Token<em>可选</em></span><input class="input" name="baidu_refresh_token" type="password" maxlength="4096" autocomplete="new-password" placeholder="用于自动刷新" /></label>
                <label class="field"><span class="field-label">Client ID</span><input class="input" name="baidu_client_id" type="text" maxlength="1024" autocomplete="off" /></label>
                <label class="field"><span class="field-label">Client Secret</span><input class="input" name="baidu_client_secret" type="password" maxlength="4096" autocomplete="new-password" /></label>
                <label class="check span-2"><input name="baidu_clear_credentials" type="checkbox" /><span>清除已保存的百度凭据</span></label>
              </div>
            </details>
          </section>

          <section data-provider-fields="pan115" class="provider-config-fields hidden">
            <div class="form-grid">
              <label class="field"><span class="field-label">Root ID</span><input class="input" name="pan115_root_id" type="text" maxlength="512" value="0" autocomplete="off" /></label>
              <label class="field"><span class="field-label">上传目录<em>固定</em></span><input class="input" name="pan115_upload_path" type="text" value="/DouYinStreamKeeper" readonly /></label>
            </div>
            <details class="disclosure">
              <summary><span>115 登录凭据</span><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronDown" /></svg></summary>
              <div class="form-grid">
                <label class="field span-2"><span class="field-label">115 Cookie</span><input class="input" name="pan115_cookie" type="password" maxlength="32768" autocomplete="new-password" placeholder="UID=...;CID=...;SEID=...;KID=..." /></label>
                <label class="field"><span class="field-label">Access Token<em>可选</em></span><input class="input" name="pan115_access_token" type="password" maxlength="4096" autocomplete="new-password" placeholder="115 Open" /></label>
                <label class="field"><span class="field-label">Refresh Token<em>可选</em></span><input class="input" name="pan115_refresh_token" type="password" maxlength="4096" autocomplete="new-password" placeholder="115 Open" /></label>
                <label class="check span-2"><input name="pan115_clear_credentials" type="checkbox" /><span>清除已保存的 115 凭据</span></label>
              </div>
            </details>
          </section>

          <section data-provider-fields="guangya" class="provider-config-fields hidden">
            <div class="form-grid">
              <label class="field"><span class="field-label">Root ID<em>选填</em></span><input class="input" name="guangya_root_id" type="text" maxlength="512" placeholder="留空表示根目录" autocomplete="off" /></label>
              <label class="field"><span class="field-label">上传目录<em>固定</em></span><input class="input" name="guangya_upload_path" type="text" value="/DouYinStreamKeeper" readonly /></label>
            </div>
            <details class="disclosure">
              <summary><span>光鸭 API 凭证</span><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronDown" /></svg></summary>
              <div class="form-grid">
                <label class="field"><span class="field-label">Client ID</span><input class="input" name="guangya_client_id" type="text" maxlength="1024" autocomplete="off" /></label>
                <label class="field"><span class="field-label">Device ID<em>选填</em></span><input class="input" name="guangya_device_id" type="text" maxlength="64" autocomplete="off" placeholder="留空自动生成" /></label>
                <label class="field"><span class="field-label">Access Token</span><input class="input" name="guangya_access_token" type="password" maxlength="4096" autocomplete="new-password" placeholder="可选" /></label>
                <label class="field"><span class="field-label">Refresh Token</span><input class="input" name="guangya_refresh_token" type="password" maxlength="4096" autocomplete="new-password" placeholder="用于自动刷新" /></label>
                <label class="check span-2"><input name="guangya_clear_credentials" type="checkbox" /><span>清除已保存的光鸭凭证</span></label>
              </div>
            </details>
          </section>
        </div>
        <footer class="modal-foot">
          <button id="provider-config-cancel" class="btn btn-soft" type="button">取消</button>
          <button id="provider-config-save" class="btn btn-primary" type="submit">保存网盘</button>
        </footer>
      </form>
    </dialog>

    <dialog id="cloud-login-dialog" class="modal modal-sm" aria-labelledby="cloud-login-title">
      <header class="modal-head">
        <span class="modal-glyph tone-info" aria-hidden="true">
          <svg class="ic ic-sm"><use href="#ic-key" /></svg>
        </span>
        <div class="modal-heading">
          <h2 id="cloud-login-title">扫码登录</h2>
          <p>登录信息只保存在本机数据库中</p>
        </div>
        <button id="cloud-login-close" class="btn btn-icon btn-ghost" type="button" aria-label="关闭">
          <svg class="ic" aria-hidden="true"><use href="#ic-close" /></svg>
        </button>
      </header>
      <div class="qr-body">
        <div class="qr-frame"><img id="cloud-login-image" alt="网盘登录二维码" /></div>
        <strong id="cloud-login-status" role="status">正在生成二维码</strong>
        <span id="cloud-login-tip"></span>
        <button id="cloud-login-refresh" class="btn btn-soft btn-sm hidden" type="button">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-refresh" /></svg>刷新二维码
        </button>
      </div>
    </dialog>

    <script type="module" src="/static/archive.js?v=20260828"></script>
  </body>
</html>
