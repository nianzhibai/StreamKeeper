<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="浏览、播放并下载服务器上已保存的直播录像" />
    <title>本地录像 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260882"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260882" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/artplayer.css?v=5.4.1" />
    <link rel="stylesheet" href="/static/style.css?v=20260882" />
  </head>
  <body data-page="recordings">
    <script src="/static/sprite.js?v=20260882"></script>
    <script src="/static/shell.js?v=20260882"></script>
    <div class="app" id="app">
      <main class="main" id="main">
        <header class="page-head">
          <div class="page-heading">
            <h1>本地录像</h1>
          </div>
          <div class="page-tools">
            <button id="recording-archive-button" class="btn btn-primary" type="button" disabled title="正在读取归档状态">
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-upload" /></svg>立即归档
            </button>
          </div>
        </header>

        <div id="page-error" class="alert alert-bad hidden" role="alert">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <span data-error-text></span>
        </div>

        <section class="card explorer" aria-label="录像文件管理器">
          <header class="explorer-bar">
            <div class="explorer-place">
              <button id="recording-up" class="btn btn-icon btn-sm btn-soft" type="button" disabled aria-label="返回上一级" title="返回上一级">
                <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronLeft" /></svg>
              </button>
              <nav id="recording-breadcrumbs" class="crumbs" aria-label="当前位置">
                <button type="button" data-path="">全部录像</button>
              </nav>
            </div>
            <div class="explorer-actions">
              <label class="search">
                <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-search" /></svg>
                <input id="recording-search" type="search" autocomplete="off" placeholder="搜索当前目录" aria-label="搜索当前目录" />
                <span class="kbd" aria-hidden="true">/</span>
              </label>
              <label class="select-inline">
                <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-sort" /></svg>
                <select id="recording-sort" aria-label="排序方式">
                  <option value="name">按名称</option>
                  <option value="modified">按时间</option>
                  <option value="size">按大小</option>
                </select>
              </label>
            </div>
          </header>

          <div class="explorer-meta">
            <span id="recording-summary">正在读取…</span>
            <span id="recording-location">录像根目录</span>
          </div>

          <div class="table-head file-head" aria-hidden="true">
            <span>名称</span><span>大小</span><span>修改时间</span><span></span>
          </div>

          <div id="recording-list" class="file-list" aria-live="polite">
            <div class="skeleton skeleton-file"></div>
            <div class="skeleton skeleton-file"></div>
            <div class="skeleton skeleton-file"></div>
            <div class="skeleton skeleton-file"></div>
          </div>

          <div id="recording-empty" class="empty hidden">
            <span class="empty-glyph"><svg class="ic" aria-hidden="true"><use href="#ic-folder" /></svg></span>
            <strong id="recording-empty-title">这个目录里还没有录像</strong>
            <small id="recording-empty-detail" class="hidden"></small>
          </div>
        </section>
      </main>
    </div>

    <dialog id="recording-player-dialog" class="modal modal-player" aria-label="播放录像">
      <header class="modal-head">
        <small id="recording-player-hint" class="player-hint hidden">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-info" /></svg>
          <span>非 MP4 格式视频，首次播放需要进行简单封装</span>
        </small>
        <button id="recording-player-close" class="btn btn-icon btn-ghost" type="button" aria-label="关闭播放器">
          <svg class="ic" aria-hidden="true"><use href="#ic-close" /></svg>
        </button>
      </header>

      <div class="player-shell">
        <div class="player-stage">
          <div id="recording-player" class="recording-artplayer" aria-label="录像播放器"></div>
          <div id="recording-player-error" class="player-msg is-error hidden">
            <span class="empty-glyph"><svg class="ic" aria-hidden="true"><use href="#ic-alert" /></svg></span>
            <strong>浏览器无法播放这段录像</strong>
            <small>编码可能不受支持，请下载后用本地播放器打开</small>
          </div>
        </div>
      </div>

      <footer class="player-foot">
        <small id="recording-player-path" class="mono">—</small>
        <small id="recording-player-meta" class="player-meta">—</small>
      </footer>
    </dialog>

    <script src="/static/artplayer.js?v=5.4.1"></script>
    <script type="module" src="/static/recordings.js?v=20260882"></script>
  </body>
</html>
