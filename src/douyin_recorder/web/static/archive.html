<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>网盘归档 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260728"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260728" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260728" />
  </head>
  <body data-page="archive">
    <script src="/static/sprite.js?v=20260728"></script>
    <div class="app" id="app">
      <main class="main">
        <header class="page-head">
          <div class="page-heading">
            <h1>网盘归档</h1>
            <p>把本地录像同步到云端，并按需清理磁盘</p>
          </div>
          <div class="page-tools">
            <button id="refresh-button" class="btn btn-icon btn-soft" type="button" aria-label="刷新" title="刷新">
              <svg class="ic" aria-hidden="true"><use href="#ic-refresh" /></svg>
            </button>
            <a class="btn btn-soft" href="/settings">归档设置</a>
            <button id="cloud-run-button" class="btn btn-primary" type="button" disabled>
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-upload" /></svg>立即归档
            </button>
          </div>
        </header>

        <div id="page-error" class="alert alert-bad hidden" role="alert">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <span data-error-text></span>
        </div>

        <section class="card hero">
          <div class="hero-state">
            <span id="archive-status" class="pill pill-lg tone-idle"><i class="dot"></i>读取中</span>
            <strong id="archive-status-time">—</strong>
          </div>
          <dl class="hero-facts">
            <div>
              <dt><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-calendar" /></svg>下次执行</dt>
              <dd id="next-run-time">—</dd>
            </div>
            <div>
              <dt><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-clock" /></svg>每日时间</dt>
              <dd id="schedule-hour">—</dd>
            </div>
            <div>
              <dt><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-shield" /></svg>文件稳定时间</dt>
              <dd id="stable-age">—</dd>
            </div>
          </dl>
        </section>

        <div class="archive-grid">
          <section class="card">
            <header class="card-head">
              <div class="card-heading">
                <h2>存储目标</h2>
                <p>启用的网盘会各保存一份副本</p>
              </div>
              <a class="link" href="/settings">管理<svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronRight" /></svg></a>
            </header>
            <div class="card-body">
              <div class="provider-row">
                <span class="provider-logo quark" aria-hidden="true">夸</span>
                <div class="provider-info">
                  <strong>夸克网盘</strong>
                  <small id="quark-path" class="mono">—</small>
                </div>
                <span id="quark-credential" class="chip">—</span>
                <span id="quark-status" class="pill tone-idle"><i class="dot"></i>读取中</span>
              </div>
              <div class="provider-row">
                <span class="provider-logo wopan" aria-hidden="true">联</span>
                <div class="provider-info">
                  <strong>联通云盘</strong>
                  <small id="wopan-path" class="mono">—</small>
                </div>
                <span id="wopan-credential" class="chip">—</span>
                <span id="wopan-status" class="pill tone-idle"><i class="dot"></i>读取中</span>
              </div>
            </div>
          </section>

          <section class="card">
            <header class="card-head">
              <div class="card-heading">
                <h2>最近执行</h2>
                <p id="last-run-time">读取中</p>
              </div>
            </header>
            <div class="card-body">
              <div class="run-metrics">
                <div><small>扫描文件</small><strong id="run-scanned">—</strong></div>
                <div><small>上传副本</small><strong id="run-uploaded">—</strong></div>
                <div><small>跳过</small><strong id="run-skipped">—</strong></div>
                <div><small>清理本地</small><strong id="run-deleted">—</strong></div>
                <div class="is-danger"><small>失败</small><strong id="run-failed">—</strong></div>
              </div>
              <p id="last-run-detail" class="run-detail">—</p>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="/static/archive.js?v=20260728"></script>
  </body>
</html>
