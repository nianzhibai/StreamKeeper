      <main class="main-content">
        <header class="page-header">
          <div><p class="page-kicker">存储</p><h1>网盘归档</h1></div>
          <div class="page-actions">
            <button id="refresh-button" class="icon-button" type="button" aria-label="刷新" title="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6" /></svg></button>

          </div>
        </header>

        <div id="page-error" class="error-banner hidden" role="alert"></div>

        <section class="archive-hero panel">
          <div class="archive-hero-state">
            <span id="archive-status" class="status-pill status-large tone-neutral"><i></i>读取中</span>
            <strong id="archive-status-time">—</strong>
          </div>
          <div class="archive-schedule-summary">
            <div><small>下次执行</small><strong id="next-run-time">—</strong></div>
            <div><small>每日时间</small><strong id="schedule-hour">—</strong></div>
            <div><small>文件稳定时间</small><strong id="stable-age">—</strong></div>
          </div>
        </section>

        <section class="archive-page-grid">
          <article class="panel providers-panel">
            <div class="panel-heading"><div><h2>存储目标</h2><span>启用的网盘会各保存一份</span></div><a class="text-link" href="/settings">管理 <span>→</span></a></div>
            <div class="provider-row">
              <span class="provider-logo quark">夸</span>
              <div class="provider-info"><strong>夸克网盘</strong><small id="quark-path">—</small></div>
              <span id="quark-credential" class="credential-state">—</span>
              <span id="quark-status" class="status-pill tone-muted"><i></i>读取中</span>
            </div>
            <div class="provider-row">
              <span class="provider-logo wopan">联</span>
              <div class="provider-info"><strong>联通云盘</strong><small id="wopan-path">—</small></div>
              <span id="wopan-credential" class="credential-state">—</span>
              <span id="wopan-status" class="status-pill tone-muted"><i></i>读取中</span>
            </div>
          </article>

          <article class="panel last-run-panel">
            <div class="panel-heading"><div><h2>最近执行</h2><span id="last-run-time">读取中</span></div></div>
            <div class="run-metrics">
              <div><small>扫描文件</small><strong id="run-scanned">—</strong></div>
              <div><small>上传副本</small><strong id="run-uploaded">—</strong></div>
              <div><small>清理本地</small><strong id="run-deleted">—</strong></div>
              <div><small>失败</small><strong id="run-failed">—</strong></div>
            </div>
            <p id="last-run-detail" class="run-detail">—</p>
          </article>
        </section>
      </main>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>
