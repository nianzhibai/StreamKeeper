<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>运行日志 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260728"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260728" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260728" />
  </head>
  <body data-page="logs">
    <script src="/static/sprite.js?v=20260728"></script>
    <div class="app" id="app">
      <main class="main">
        <header class="page-head">
          <div class="page-heading">
            <h1>运行日志</h1>
            <p>只记录关键事件，用来判断服务运行是否正常</p>
          </div>
          <div class="page-tools">
            <button id="refresh-button" class="btn btn-icon btn-soft" type="button" aria-label="刷新" title="刷新">
              <svg class="ic" aria-hidden="true"><use href="#ic-refresh" /></svg>
            </button>
          </div>
        </header>

        <div id="page-error" class="alert alert-bad hidden" role="alert">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <span data-error-text></span>
        </div>

        <section class="card hero">
          <div class="hero-state">
            <span id="log-status" class="pill pill-lg tone-idle"><i class="dot"></i>读取中</span>
            <strong id="log-status-time">—</strong>
          </div>
          <dl class="hero-facts">
            <div>
              <dt><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>24 小时异常</dt>
              <dd id="log-errors">—</dd>
            </div>
            <div>
              <dt><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-shield" /></svg>24 小时警告</dt>
              <dd id="log-warnings">—</dd>
            </div>
            <div>
              <dt><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-layers" /></svg>累计记录</dt>
              <dd id="log-total">—</dd>
            </div>
          </dl>
        </section>

        <section class="toolbar" aria-label="日志筛选">
          <div class="seg" role="group" aria-label="按类别筛选">
            <button class="seg-item is-active" type="button" data-category="">全部</button>
            <button class="seg-item" type="button" data-category="task">录制</button>
            <button class="seg-item" type="button" data-category="upload">归档</button>
            <button class="seg-item" type="button" data-category="system">系统</button>
            <button class="seg-item" type="button" data-category="auth">账号</button>
          </div>
          <label class="select-inline">
            <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-sort" /></svg>
            <select id="log-level" aria-label="按级别筛选">
              <option value="">全部级别</option>
              <option value="alerts">只看异常和警告</option>
            </select>
          </label>
        </section>

        <section class="card">
          <div class="explorer-meta">
            <span id="log-summary">正在读取…</span>
            <span id="log-hint">每 5 秒自动刷新</span>
          </div>
          <ol id="log-list" class="log-list" aria-live="polite" aria-label="运行事件">
            <li class="skeleton skeleton-row"></li>
            <li class="skeleton skeleton-row"></li>
            <li class="skeleton skeleton-row"></li>
          </ol>
          <div id="log-empty" class="empty empty-sm hidden">
            <span class="empty-glyph"><svg class="ic" aria-hidden="true"><use href="#ic-logs" /></svg></span>
            <strong>暂无运行事件</strong>
            <small>启动录制任务或执行网盘归档后，这里会记录关键节点</small>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/static/logs.js?v=20260728"></script>
  </body>
</html>
