<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>设置 · Stream Keeper</title>
    <script src="/static/theme.js?v=20260728"></script>
    <link rel="icon" href="/static/favicon.svg?v=20260728" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260728" />
  </head>
  <body data-page="settings">
    <script src="/static/sprite.js?v=20260728"></script>
    <div class="app" id="app">
      <main class="main main-settings">
        <header class="page-head">
          <div class="page-heading">
            <h1>设置</h1>
            <p>网盘账号授权与归档执行计划</p>
          </div>
          <div class="page-tools">
            <a class="btn btn-soft" href="/archive">查看归档</a>
          </div>
        </header>

        <div id="page-error" class="alert alert-bad hidden" role="alert">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-alert" /></svg>
          <span data-error-text></span>
        </div>

        <form id="cloud-form" class="settings">
          <section id="quark-settings" class="card provider-card">
            <header class="card-head">
              <span class="provider-logo quark" aria-hidden="true">夸</span>
              <div class="card-heading">
                <h2>夸克网盘</h2>
                <p id="quark-credential-hint">读取中</p>
              </div>
              <label class="switch-field">
                <input name="quark_enabled" type="checkbox" />
                <span class="switch" aria-hidden="true"></span>
                <span>启用</span>
              </label>
            </header>
            <div class="card-body">
              <div class="auth-row">
                <div>
                  <strong>账号授权</strong>
                  <small>使用夸克 App 扫码，无需手动复制 Cookie</small>
                </div>
                <button class="btn btn-soft" type="button" data-cloud-login="quark">
                  <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-key" /></svg>扫码登录
                </button>
              </div>
              <div class="form-grid">
                <label class="field">
                  <span class="field-label">Root ID</span>
                  <input class="input" name="quark_root_id" type="text" maxlength="512" value="0" autocomplete="off" />
                </label>
                <label class="field">
                  <span class="field-label">上传目录</span>
                  <input class="input" name="quark_upload_path" type="text" value="/DouYinStreamKeeper" readonly />
                </label>
              </div>
              <details class="disclosure">
                <summary>
                  <span>手动凭证</span>
                  <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronDown" /></svg>
                </summary>
                <div class="form-grid">
                  <label class="field span-2">
                    <span class="field-label">Cookie</span>
                    <input class="input" name="quark_cookie" type="password" maxlength="32768" autocomplete="new-password" placeholder="留空则保持现有 Cookie" />
                  </label>
                  <label class="check span-2">
                    <input name="quark_clear_cookie" type="checkbox" />
                    <span>清除已保存的 Cookie</span>
                  </label>
                </div>
              </details>
            </div>
          </section>

          <section id="wopan-settings" class="card provider-card">
            <header class="card-head">
              <span class="provider-logo wopan" aria-hidden="true">联</span>
              <div class="card-heading">
                <h2>联通云盘</h2>
                <p id="wopan-credential-hint">读取中</p>
              </div>
              <label class="switch-field">
                <input name="wopan_enabled" type="checkbox" />
                <span class="switch" aria-hidden="true"></span>
                <span>启用</span>
              </label>
            </header>
            <div class="card-body">
              <div class="auth-row">
                <div>
                  <strong>账号授权</strong>
                  <small>使用联通云盘 App 扫码获取 Token</small>
                </div>
                <button class="btn btn-soft" type="button" data-cloud-login="wopan">
                  <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-key" /></svg>扫码登录
                </button>
              </div>
              <div class="form-grid">
                <label class="field">
                  <span class="field-label">Root ID</span>
                  <input class="input" name="wopan_root_id" type="text" maxlength="512" value="0" autocomplete="off" />
                </label>
                <label class="field">
                  <span class="field-label">Family ID<em>选填</em></span>
                  <input class="input" name="wopan_family_id" type="text" maxlength="512" placeholder="个人云可留空" autocomplete="off" />
                </label>
                <label class="field span-2">
                  <span class="field-label">上传目录</span>
                  <input class="input" name="wopan_upload_path" type="text" value="/DouYinStreamKeeper" readonly />
                </label>
              </div>
              <details class="disclosure">
                <summary>
                  <span>手动凭证</span>
                  <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevronDown" /></svg>
                </summary>
                <div class="form-grid">
                  <label class="field">
                    <span class="field-label">Access Token</span>
                    <input class="input" name="wopan_access_token" type="password" maxlength="4096" autocomplete="new-password" placeholder="留空则保持不变" />
                  </label>
                  <label class="field">
                    <span class="field-label">Refresh Token</span>
                    <input class="input" name="wopan_refresh_token" type="password" maxlength="4096" autocomplete="new-password" placeholder="留空则保持不变" />
                  </label>
                  <label class="check span-2">
                    <input name="wopan_clear_tokens" type="checkbox" />
                    <span>清除已保存的 Token</span>
                  </label>
                </div>
              </details>
            </div>
          </section>

          <section class="card">
            <header class="card-head">
              <span class="provider-logo neutral" aria-hidden="true">
                <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-clock" /></svg>
              </span>
              <div class="card-heading">
                <h2>执行计划</h2>
                <p>使用服务器本地时区</p>
              </div>
            </header>
            <div class="card-body">
              <div class="form-grid form-grid-3">
                <label class="field">
                  <span class="field-label">每日开始时间</span>
                  <span class="suffix"><input class="input" name="upload_hour" type="number" min="0" max="23" step="1" value="1" /><em>时</em></span>
                </label>
                <label class="field">
                  <span class="field-label">文件稳定时间</span>
                  <span class="suffix"><input class="input" name="upload_min_age_minutes" type="number" min="0" max="1440" step="1" value="10" /><em>分钟</em></span>
                </label>
                <label class="field">
                  <span class="field-label">网络超时</span>
                  <span class="suffix"><input class="input" name="upload_timeout_seconds" type="number" min="30" max="86400" step="1" value="300" /><em>秒</em></span>
                </label>
                <p class="field-hint span-3">只有最后修改时间超过「文件稳定时间」的录像才会被上传，避免传走正在写入的片段。</p>
              </div>
            </div>
          </section>

          <div class="save-bar">
            <span class="save-hint" data-save-hint>所有更改已保存</span>
            <div class="save-actions">
              <button class="btn btn-soft" type="button" data-reset-form>放弃更改</button>
              <button id="cloud-save-button" class="btn btn-primary" type="submit">保存设置</button>
            </div>
          </div>
        </form>
      </main>
    </div>

    <dialog id="cloud-login-dialog" class="modal modal-sm" aria-labelledby="cloud-login-title">
      <header class="modal-head">
        <div class="modal-heading">
          <h2 id="cloud-login-title">扫码登录</h2>
          <p>登录信息只保存在本机数据库中</p>
        </div>
        <button id="cloud-login-close" class="btn btn-icon btn-ghost" type="button" aria-label="关闭">
          <svg class="ic" aria-hidden="true"><use href="#ic-close" /></svg>
        </button>
      </header>
      <div class="qr-body">
        <div class="qr-frame"><img id="cloud-login-image" alt="网盘登录二维码" /></div>
        <strong id="cloud-login-status" role="status">正在生成二维码</strong>
        <span id="cloud-login-tip"></span>
        <button id="cloud-login-refresh" class="btn btn-soft btn-sm hidden" type="button">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-refresh" /></svg>刷新二维码
        </button>
      </div>
    </dialog>

    <script type="module" src="/static/settings.js?v=20260728"></script>
  </body>
</html>
