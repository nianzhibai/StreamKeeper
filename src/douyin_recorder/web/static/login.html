<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>登录 · Stream Keeper</title>
    <link rel="stylesheet" href="/static/style.css?v=20260712-ui1" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <a class="brand" href="/login" aria-label="Stream Keeper 登录">
          <span class="brand-mark"><i></i></span>
          <span class="brand-copy"><strong>Stream Keeper</strong><small>直播录制</small></span>
        </a>

        <div class="login-heading">
          <h1 id="login-title">登录</h1>
        </div>

        <form id="login-form" class="login-form">
          <label class="field">
            <span>用户名</span>
            <input id="login-username" name="username" type="text" required maxlength="128" autocomplete="username" autofocus />
          </label>
          <label class="field">
            <span>密码</span>
            <input id="login-password" name="password" type="password" required maxlength="1024" autocomplete="current-password" />
          </label>
          <p id="login-error" class="login-error hidden" role="alert" aria-live="polite"></p>
          <button id="login-submit" class="primary-button login-submit" type="submit">登录</button>
        </form>
      </section>
    </main>
    <script src="/static/login.js?v=20260712-ui1" defer></script>
  </body>
</html>
