<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>DouYinStreamKeeper</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="首页">
        <span class="brand-mark">录</span>
        <strong>DouYinStreamKeeper</strong>
      </a>
      <div class="topbar-actions">
        <span id="server-health" class="health"><i></i> 正在连接</span>
        <span id="account-name" class="account-name"></span>
        <a class="ghost-button" href="/api/docs" target="_blank" rel="noreferrer">API 文档</a>
        <button id="logout-button" class="ghost-button logout-button" type="button">退出</button>
        <button id="refresh-button" class="icon-button" type="button" title="立即刷新" aria-label="立即刷新">↻</button>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero">
        <h1>直播录制</h1>
        <button id="open-create-button" class="primary-button hero-button" type="button">
          <span>＋</span> 新建任务
        </button>
      </section>

      <section class="stats" aria-label="服务状态">
        <article class="stat-card">
          <span>任务</span>
          <strong id="stat-total">—</strong>
        </article>
        <article class="stat-card accent-red">
          <span>录制中</span>
          <strong id="stat-recording">—</strong>
        </article>
        <article class="stat-card accent-green">
          <span>值守中</span>
          <strong id="stat-waiting">—</strong>
        </article>
        <article class="stat-card accent-amber">
          <span>可用空间</span>
          <strong id="stat-disk">—</strong>
        </article>
      </section>

      <section class="task-section">
        <div class="section-heading">
          <h2>任务</h2>
          <div class="filter-group" role="group" aria-label="任务筛选">
            <button class="filter-button active" type="button" data-filter="all">全部</button>
            <button class="filter-button" type="button" data-filter="recording">录制中</button>
            <button class="filter-button" type="button" data-filter="enabled">值守中</button>
            <button class="filter-button" type="button" data-filter="error">异常</button>
          </div>
        </div>

        <div id="error-banner" class="error-banner hidden" role="alert"></div>
        <div id="task-list" class="task-grid" aria-live="polite">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>

        <div id="empty-state" class="empty-state hidden">
          <h3>暂无任务</h3>
          <button class="primary-button" type="button" data-open-create>新建任务</button>
        </div>
      </section>
    </main>

    <dialog id="create-dialog" class="task-dialog" aria-labelledby="dialog-title">
      <form id="create-form" method="dialog">
        <div class="dialog-heading">
          <h2 id="dialog-title">新建任务</h2>
          <button class="dialog-close" type="button" data-close-dialog aria-label="关闭">×</button>
        </div>

        <label class="field field-wide">
          <span>直播间地址 <b>*</b></span>
          <div class="url-input-row">
            <input id="task-url" name="url" type="text" required maxlength="1000" inputmode="url" placeholder="粘贴链接或分享文案" autocomplete="off" />
            <button id="inspect-button" class="secondary-button" type="button">检测</button>
          </div>
        </label>

        <div id="inspect-result" class="inspect-result hidden"></div>

        <div class="form-grid">
          <label class="field field-wide">
            <span>任务备注</span>
            <input name="label" type="text" maxlength="80" placeholder="可选" />
          </label>

          <label class="field">
            <span>画质</span>
            <select name="quality">
              <option value="OD">原画</option>
              <option value="UHD">超清</option>
              <option value="HD">高清</option>
              <option value="SD">标清</option>
              <option value="LD">流畅</option>
            </select>
          </label>

          <label class="field">
            <span>保存格式</span>
            <select name="output_format">
              <option value="ts">TS（推荐）</option>
              <option value="mp4">MP4</option>
              <option value="mkv">MKV</option>
              <option value="flv">FLV</option>
            </select>
          </label>

          <label class="field">
            <span>直播源</span>
            <select name="source">
              <option value="auto">自动选择</option>
              <option value="flv">优先 FLV</option>
              <option value="hls">使用 HLS</option>
            </select>
          </label>

          <label class="field">
            <span>分段（秒）</span>
            <input name="segment_seconds" type="number" min="0" max="86400" step="1" value="1800" />
          </label>

          <label class="field">
            <span>段数（0 不限）</span>
            <input name="segment_count" type="number" min="0" max="10000" step="1" value="4" />
          </label>

          <label class="field">
            <span>检查间隔（秒）</span>
            <input name="interval_seconds" type="number" min="10" max="86400" step="1" value="60" />
          </label>

          <div class="toggle-stack field-wide">
            <label class="toggle-field">
              <input name="monitor" type="checkbox" checked />
              <span class="toggle"></span>
              <strong>持续值守</strong>
            </label>
            <label id="auto-start-field" class="toggle-field">
              <input name="auto_start" type="checkbox" checked />
              <span class="toggle"></span>
              <strong>立即启动</strong>
            </label>
          </div>
        </div>

        <div class="dialog-actions">
          <button class="secondary-button" type="button" data-close-dialog>取消</button>
          <button id="create-submit" class="primary-button" type="submit">创建任务</button>
        </div>
      </form>
    </dialog>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
